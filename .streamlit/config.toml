[browser]
gatherUsageStats = false

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
paddingTop = "2rem"
paddingBottom = "3rem"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "26px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true

[theme.light]
primaryColor = "#0E4D7A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#0E4D7A"
borderColor = "#E2E8F0"
codeTextColor = "#0F172A"
grayColor = "#64748B"
blueColor = "#0284C7"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
chartCategoricalColors = ["#0E4D7A", "#1B6B46", "#0284C7", "#EA580C", "#7C3AED", "#DC2626", "#64748B"]
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"

[theme.dark]
primaryColor = "#38BDF8"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
linkColor = "#38BDF8"
borderColor = "#1E293B"
codeTextColor = "#E2E8F0"
grayColor = "#94A3B8"
blueColor = "#38BDF8"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
chartCategoricalColors = ["#38BDF8", "#4ADE80", "#FACC15", "#FB923C", "#A78BFA", "#F87171", "#94A3B8"]
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#111827"
dataframeHeaderTextColor = "#F8FAFC"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#0E4D7A"
linkColor = "#0E4D7A"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeBorderColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#06090F"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#1E293B"
primaryColor = "#38BDF8"
linkColor = "#38BDF8"
dataframeHeaderBackgroundColor = "#111827"
dataframeBorderColor = "#1E293B"
